</svg><span>Pass it on · Share my page</span></button><p id="status" role="status" aria-live="polite"></p>
<footer><span class="signature">sh.</span><span>One page. A few ways to connect.</span></footer>
</main><script>
// Icons: Iconoir, MIT. Full attribution accompanies this file.
const root=document.documentElement,themeButton=document.querySelector('#theme'),themeMeta=document.querySelector('meta[name="theme-color"]');
function setTheme(theme){root.dataset.theme=theme;themeButton.setAttribute('aria-label',theme==='dark'?'Switch to light mode':'Switch to dark mode');themeButton.setAttribute('aria-pressed',String(theme==='light'));themeMeta.content=theme==='dark'?'#081d17':'#f1f4eb';}
try{const saved=localStorage.getItem('shlomo-theme');if(saved==='light'||saved==='dark')setTheme(saved);}catch{}
themeButton.addEventListener('click',()=>{const next=root.dataset.theme==='dark'?'light':'dark';setTheme(next);try{localStorage.setItem('shlomo-theme',next);}catch{}});
document.querySelector('#share').addEventListener('click',async()=>{const status=document.querySelector('#status');if(!/^https?:$/.test(location.protocol)){status.textContent='Sharing will be available once this page is published.';return;}try{if(navigator.share){await navigator.share({title:'Shlomo Hess · Connect',url:location.href});status.textContent='';}else if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(location.href);status.textContent='Link copied. Ready to share.';}else{status.textContent='Copy the address from your browser to share this page.';}}catch(error){status.textContent=error.name==='AbortError'?'':'Could not share. Copy the address from your browser instead.';}});
</script>
